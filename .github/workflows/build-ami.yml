name: Build VM AMI

on:
  workflow_dispatch:
    inputs:
      target_app:
        description: "Target application, eg: airflow, backend"
        required: true
        type: choice
        options:
          - airflow
          - backend

jobs:
  trigger-ami-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Trigger AMI build
        env:
          GH_TOKEN: ${{ secrets.CICD_TRIGGER_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/Housing-Intelligence/hi-platform-cicd/actions/workflows/build-ami.yml/dispatches \
            -d '{
              "ref": "main",
              "inputs": {
                "target_repository": "Housing-Intelligence/hi-app-terraforms",
                "packer_directory": "${{ inputs.target_app }}/packer",
                "aws_region": "us-east-2",
                "subnet_id": "${{ secrets.AWS_PUBLIC_SUBNET_1 }}",
                "ami_name": "${{ inputs.target_app }}-master"
              }
            }'