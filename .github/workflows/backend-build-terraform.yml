name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
          
      template:
        description: "Template name, e.g. dev-mintest"
        required: true
        type: string
        
      action:
        description: "Terraform action to perform, e.g. apply or destroy"
        required: true
        type: choice
        options:
          - apply
          - destroy

jobs:
  trigger-airflow-ami-build:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Backend Terraform deployment
        env:
          GH_TOKEN: ${{ secrets.CICD_TRIGGER_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/Housing-Intelligence/hi-platform-cicd/actions/workflows/terraform-apply.yml/dispatches \
            -d '{
              "ref": "main",
              "inputs": {
                "target_repository": "Housing-Intelligence/hi-app-terraforms",
                "terraform_directory": "airflow/terraform",
              }
            }'