name: Build Airflow Image

on:
  workflow_dispatch:
    inputs:
      target_app:
        description: "Target application, eg: airflow, backend"
        required: true
        type: choice
        options:
          - airflow
          - backend

      image_tags:
        description: "Docker image tags, comma-separated, e.g. latest,3.3.1,abc123"
        required: false
        type: string

jobs:
  trigger-airflow-docker-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Trigger docker build and promote to ecr
        env:
          GH_TOKEN: ${{ secrets.CICD_TRIGGER_TOKEN }}
        run: |
          if [[ -z "${{ inputs.image_tags }}" ]]; then
            echo "No image tags provided, using default SHA"
            IMAGE_TAGS="${{ github.sha }}"
          else
            IMAGE_TAGS="${{ inputs.image_tags }}"
          fi

          echo "Image tags: ${IMAGE_TAGS}"

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/Housing-Intelligence/hi-platform-cicd/actions/workflows/docker-build-push-ecr.yml/dispatches \
            -d @- <<EOF
          {
            "ref": "main",
            "inputs": {
              "target_repository":
                "Housing-Intelligence/hi-app-terraforms",
              "app_directory":
                "${{ inputs.target_app }}",
              "aws_region":
                "us-east-2",
              "image_name":
                "${{ inputs.target_app }}",
              "image_tags":
                "${IMAGE_TAGS}"
            }
          }
          EOF