services:

  airflow-init:
    image: ${AIRFLOW_IMAGE}

    env_file:
      - .env

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./configs:/opt/airflow/config:ro

    entrypoint: ["/bin/bash"]
    command:
      - /opt/airflow/scripts/airflow-init.sh


  airflow-api-server:
    image: ${AIRFLOW_IMAGE}

    env_file:
      - .env

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    command:
      - api-server

    restart: unless-stopped


  airflow-scheduler:
    image: ${AIRFLOW_IMAGE}

    env_file:
      - .env

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command:
      - scheduler

    restart: unless-stopped


  airflow-dag-processor:
    image: ${AIRFLOW_IMAGE}

    env_file:
      - .env

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command:
      - dag-processor

    restart: unless-stopped